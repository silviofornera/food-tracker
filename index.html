<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Food Tracker</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f5f1e8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#16150f" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Food">
<!-- build:remove -->
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<!-- /build:remove -->
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div id="app">
  <header class="top">
    <div class="datebar">
      <button class="icon" data-act="prev" aria-label="Previous day">&#8249;</button>
      <button class="date" data-act="today" id="date-label"></button>
      <button class="icon" data-act="next" aria-label="Next day">&#8250;</button>
      <span class="spacer"></span>
      <button class="icon small" data-act="sync" id="sync-btn" aria-label="Sync with Google Drive" hidden>&#8645;</button>
      <button class="icon small" data-act="settings" aria-label="Settings">&#9881;</button>
    </div>
    <div id="totals" class="totals"></div>
    <div class="searchbar">
      <input id="q" type="search" inputmode="search" enterkeyhint="search" autocomplete="off" autocorrect="off" spellcheck="false"
             placeholder="Search food to add" aria-label="Search food" autofocus>
      <button class="icon small" data-act="scan" aria-label="Barcode"><svg width="24" height="20" viewBox="0 0 24 20" fill="currentColor" aria-hidden="true"><path d="M1 2h2v16H1zM5 2h1v16H5zM8 2h3v16H8zM13 2h1v16h-1zM16 2h2v16h-2zM20 2h1v16h-1zM22 2h1v16h-1z"/></svg></button>
      <button class="link" data-act="cancel" id="cancel-btn" hidden>Cancel</button>
    </div>
  </header>
  <main>
    <div id="notice"></div>
    <section id="results" hidden></section>
    <section id="home"></section>
  </main>
</div>
<div id="backdrop" class="backdrop" hidden></div>
<div id="sheet" class="sheet" role="dialog" aria-modal="true" hidden></div>
<div id="toast" class="toast" hidden></div>
<script src="js/nutrition.js"></script>
<script src="js/foods-data.js"></script>
<script src="js/store.js"></script>
<script src="js/api.js"></script>
<script src="js/drive.js"></script>
<script src="js/cloud.js"></script>
<script src="js/app.js"></script>
</body>
</html>
